name: Build Unikraft rootfs
on:
  push:
    branches: [unikraft-deploy]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: postiz-rootfs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          UKC_TOKEN: op://TSE Systems/unikernels - kraft robot token - account-scoped/password
      - uses: the-software-engineer/unikraft-deploy/actions/registry-check@main
        with:
          spec: .github/rootfs-preflight.yaml
          metro: sfo
          image: tgregory/postiz-rootfs:sha-${{ github.sha }}
          expected-bytes: '1500000000'
          ukc-user: tgregory
          ukc-token: ${{ env.UKC_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: index.unikraft.io
          username: tgregory
          password: ${{ env.UKC_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ukc
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: index.unikraft.io/tgregory/postiz-rootfs:sha-${{ github.sha }}
          build-args: NEXT_PUBLIC_VERSION=${{ github.sha }}
